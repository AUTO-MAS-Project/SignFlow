[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signflow"
version = "0.1.0"
description = "SignFlow 游戏社区核心插件：账号、平台协议与社区数据门面"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:signflow"]
dependencies = ["auto-mas-core>=5.9.0b1,<6"]

[project.urls]
Homepage = "https://github.com/AUTO-MAS-Project/SignFlow"
Repository = "https://github.com/AUTO-MAS-Project/SignFlow"
Documentation = "https://doc.auto-mas.top/developer/"
Changelog = "https://github.com/AUTO-MAS-Project/SignFlow/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signflow = ["py.typed", "i18n/*.json"]
