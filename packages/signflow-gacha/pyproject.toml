[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signflow-gacha"
version = "0.1.0"
description = "记录并展示抽卡结果，首批接入森空岛明日方舟，其他游戏按 tag 分页预留。"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:signflow_gacha"]
dependencies = ["auto-mas-core>=5.10.0b2,<6", "signflow>=0.1.0,<0.2"]

[project.urls]
Homepage = "https://github.com/AUTO-MAS-Project/SignFlow"
Repository = "https://github.com/AUTO-MAS-Project/SignFlow"
Documentation = "https://doc.auto-mas.top/developer/"
Changelog = "https://github.com/AUTO-MAS-Project/SignFlow/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signflow_gacha = ["py.typed", "i18n/*.json"]
