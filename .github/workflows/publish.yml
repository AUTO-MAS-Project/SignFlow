#   SignFlow: AUTO-MAS 游戏社区插件集合
#   Copyright © 2025-2026 AUTO-MAS Team
#
#   五个包同版本发布（lockstep）：一个 `vX.Y.Z` 标签对应全部五个包的同名版本，
#   构建与校验通过后由 PyPI 受信发布（Trusted Publishing）统一上传，不需要任何仓库密钥。
#
#   首次发布前，需要仓库维护者在 PyPI 侧为 signflow / signflow-notes / signflow-gacha /
#   signflow-token / signflow-sign 各配置一次受信发布者，五项都要填：
#   Owner AUTO-MAS-Project、Repository SignFlow、Workflow name publish.yml、Environment pypi。
name: Publish

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  # 标签发布是一次性的对外承诺，不能被后来者取消；分支与 PR 只保留最新一次构建。
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    name: 构建 ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - signflow
          - signflow-notes
          - signflow-gacha
          - signflow-token
          - signflow-sign
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # 五个包共用同一个版本号，标签只要和本包对不上就说明漏改了某个 pyproject。
      - name: 检查发布标签与包版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE: ${{ matrix.package }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package = os.environ["PACKAGE"]
          tag = os.environ["RELEASE_TAG"]
          pyproject = Path("packages", package, "pyproject.toml")
          version = tomllib.loads(pyproject.read_text(encoding="utf-8"))["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"{package} 的版本 {version} 与发布标签 {tag} 不一致")
          PY
      - name: 安装构建工具
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: 构建 wheel 和源码包
        run: python -m build --outdir dist packages/${{ matrix.package }}
      - name: 校验包元数据
        run: python -m twine check --strict dist/*
      # PyPI 会把 Project-URL 直接渲染成项目页链接，坏链接要在这里拦住而不是发布后才发现。
      - name: 校验分发包中的项目链接
        run: |
          python - <<'PY'
          from email import policy
          from email.parser import BytesParser
          from pathlib import Path
          from urllib.parse import urlsplit
          from zipfile import ZipFile

          for path in Path("dist").glob("*.whl"):
              with ZipFile(path) as wheel:
                  name = next(item for item in wheel.namelist() if item.endswith(".dist-info/METADATA"))
                  metadata = BytesParser(policy=policy.default).parsebytes(wheel.read(name))
              for value in metadata.get_all("Project-URL", []):
                  label, url = str(value).split(",", 1)
                  parsed = urlsplit(url.strip())
                  if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                      raise SystemExit(f"{path.name} 的 {label} 必须是有效的 HTTP/HTTPS 项目链接")
          PY
      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions-${{ matrix.package }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: 发布到 PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 环境名必须与 PyPI 受信发布者里填的一致，否则 OIDC 换不到上传凭据。
    environment:
      name: pypi
      url: https://pypi.org/p/signflow
    permissions:
      id-token: write
    steps:
      - name: 汇总五个包的构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: python-distributions-*
          path: dist/
          merge-multiple: true
      # 五个包一次上传，中途哪个失败都可能已经推上去了一部分；
      # 带 skip-existing 才能用"重跑工作流"收尾，而不是被迫再发一个新版本号。
      - name: 使用受信发布上传
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
